<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Wayback Bulk Save</title>
  <desc id="d">Archive whole websites, pages and files, to the Internet Archive's Wayback Machine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect x="64" y="62" width="6" height="104" rx="3" fill="url(#accent)"/>

  <text x="92" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#e6edf3">Wayback Bulk Save</text>
  <text x="92" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#9da7b3">Save whole websites, pages and files, to the Wayback Machine.</text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#c9d1d9">
    <rect x="64" y="208" width="176" height="40" rx="20" fill="#21293a" stroke="#344056"/>
    <text x="152" y="234" text-anchor="middle">Resumable</text>
    <rect x="256" y="208" width="252" height="40" rx="20" fill="#21293a" stroke="#344056"/>
    <text x="382" y="234" text-anchor="middle">Handles daily limits</text>
    <rect x="524" y="208" width="188" height="40" rx="20" fill="#21293a" stroke="#344056"/>
    <text x="618" y="234" text-anchor="middle">Runs on Termux</text>
  </g>

  <!-- website pages -> archive clock -->
  <g transform="translate(868 62)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#58a6ff" stroke-width="4">
      <rect x="0" y="40" width="96" height="124" rx="10" fill="#0d1117"/>
      <rect x="16" y="20" width="96" height="124" rx="10" fill="#0d1117"/>
      <rect x="32" y="0" width="96" height="124" rx="10" fill="#14233a"/>
      <path d="M52 30h56M52 50h56M52 70h36" stroke-width="5"/>
    </g>
    <path d="M148 62h56" stroke="#9da7b3" stroke-width="4"/>
    <path d="M192 48l16 14-16 14" stroke="#9da7b3" stroke-width="4"/>
    <g stroke="#3fb950" stroke-width="5">
      <circle cx="290" cy="62" r="56" fill="#0f2a1a"/>
      <path d="M290 28v34l24 16"/>
    </g>
  </g>
</svg>
