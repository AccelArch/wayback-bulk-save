<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Wayback Bulk Save</title>
  <desc id="d">Social preview card: save whole websites, pages and files, to the Wayback Machine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="628" width="1280" height="12" fill="url(#accent)"/>

  <!-- website pages -> archive clock -->
  <g transform="translate(96 60) scale(1.2)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#58a6ff" stroke-width="4">
      <rect x="0" y="40" width="96" height="124" rx="10" fill="#0d1117"/>
      <rect x="16" y="20" width="96" height="124" rx="10" fill="#0d1117"/>
      <rect x="32" y="0" width="96" height="124" rx="10" fill="#14233a"/>
      <path d="M52 30h56M52 50h56M52 70h36" stroke-width="5"/>
    </g>
    <path d="M148 62h56" stroke="#9da7b3" stroke-width="4"/>
    <path d="M192 48l16 14-16 14" stroke="#9da7b3" stroke-width="4"/>
    <g stroke="#3fb950" stroke-width="5">
      <circle cx="290" cy="62" r="56" fill="#0f2a1a"/>
      <path d="M290 28v34l24 16"/>
    </g>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="372" font-size="92" font-weight="700" fill="#e6edf3">Wayback Bulk Save</text>
    <text x="98" y="430" font-size="34" fill="#9da7b3">Save whole websites, pages and files, to the Wayback Machine.</text>

    <g font-size="24" fill="#c9d1d9">
      <rect x="96" y="472" width="212" height="52" rx="26" fill="#21293a" stroke="#344056"/>
      <text x="202" y="506" text-anchor="middle">Resumable</text>
      <rect x="324" y="472" width="300" height="52" rx="26" fill="#21293a" stroke="#344056"/>
      <text x="474" y="506" text-anchor="middle">Handles daily limits</text>
      <rect x="640" y="472" width="236" height="52" rx="26" fill="#21293a" stroke="#344056"/>
      <text x="758" y="506" text-anchor="middle">Runs on Termux</text>
    </g>

    <text x="98" y="588" font-size="24" fill="#6e7a8a">github.com/AccelArch/wayback-bulk-save</text>
  </g>
</svg>
